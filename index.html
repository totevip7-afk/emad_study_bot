<script>
const C0=[
{id:'life1',name:'مهارات حياتية',day:6,start:'11:00',end:'12:00',place:'Online',color:0},

{id:'life2',name:'مهارات حياتية',day:1,start:'15:00',end:'16:00',place:'Online',color:0},
{id:'jor1',name:'الأردن تاريخ وحضارة',day:1,start:'15:00',end:'16:30',place:'Online',color:3},
{id:'jor2',name:'الأردن تاريخ وحضارة',day:2,start:'15:00',end:'16:30',place:'Online',color:3},
{id:'trauma1',name:'علاج الإصابات الطارئة',day:3,start:'08:00',end:'09:30',place:'ط.ب قاعة 13',color:4},
{id:'mass2',name:'حوادث الإصابات الجماعية',day:3,start:'09:00',end:'10:00',place:'Online / ط.س قاعة 4',color:1},
{id:'cardiac1',name:'إسعاف القلب الطارئ',day:3,start:'09:30',end:'11:00',place:'ط.ب قاعة 1',color:5},
{id:'ethics1',name:'أخلاقيات وتشريعات الإسعاف',day:3,start:'11:00',end:'12:30',place:'ط.ب قاعة 14',color:6},
{id:'res2',name:'مسارات البحث العلمي',day:3,start:'13:30',end:'14:30',place:'Online / ط.س قاعة 1',color:2},
{id:'trauma2',name:'علاج الإصابات الطارئة',day:4,start:'08:00',end:'09:30',place:'ط.ب قاعة 13',color:4},
{id:'cardiac2',name:'إسعاف القلب الطارئ',day:4,start:'09:30',end:'11:00',place:'ط.ب قاعة 1',color:5},
{id:'ethics2',name:'أخلاقيات وتشريعات الإسعاف',day:4,start:'11:00',end:'12:30',place:'ط.ب قاعة 14',color:6}];
const DAYN={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة'},ORDER=[6,0,1,2,3,4,5],LB={onsite:'حضوري',online:'أونلاين',absent:'غياب'},KC={onsite:'var(--ok)',online:'var(--on)',absent:'var(--bad)'};
const t12=t=>{const[a,b]=t.split(':'),h=+a;return(h%12||12)+':'+b+' '+(h<12?'ص':'م')},tr=s=>String(s).replace(/\d{1,2}:\d{2}/g,t12);
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let COURSES=ld('courses2',null)||C0.map(c=>({...c})),ATT=ld('att2',{}),S=ld('set2',{rem:15,remOn:false,theme:'auto'}),TAB='home',OFF=0,FILT='all',SF='all',EDIT=null,EDITD=null,PEND=null,TRASH=ld('trash2',[]);
const saveAll=()=>{sv('courses2',COURSES);sv('att2',ATT);sv('set2',S);sv('trash2',TRASH)};
{const m=COURSES.find(c=>c.id==='mass1'&&c.day===0&&c.start==='12:30');if(m){m.start='09:00';m.end='10:00';saveAll()}}
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,mn=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const wsOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+1)%7));return x},addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fd=(d,o)=>d.toLocaleDateString('ar',o),fh=n=>n%1?n.toFixed(1):n;
function occ(date){return COURSES.filter(c=>c.day===date.getDay()&&(!c.date||c.date===iso(date))&&!(c.skip&&c.skip.includes(iso(date)))).map(c=>{const st=new Date(date);st.setHours(0,mn(c.start),0,0);return{c,date,key:c.id+'|'+iso(date),st}}).sort((a,b)=>a.st-b.st)}
function conf(L){const s=new Set();L.forEach((a,i)=>L.forEach((b,j)=>{if(i<j&&mn(a.c.start)<mn(b.c.end)&&mn(b.c.start)<mn(a.c.end)){s.add(a.c.id);s.add(b.c.id)}}));return s}
function lec(o,cf){const{c,date,key}=o,r=ATT[key],started=true;
const a=r?`<div class="rec"><span>${LB[r.s]} · سُجّل ${new Date(r.t).toLocaleString('ar',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit',hour12:true})}</span><button data-undo="${key}" aria-label="تراجع">↶</button></div>`:started?`<div class="how">كيف حضرت؟</div><div class="bt">${['onsite','online','absent'].map(s=>`<button class="b-${s}" data-set="${s}" data-id="${c.id}" data-d="${iso(date)}">${LB[s]}</button>`).join('')}</div>`:'<small class="mu">لم تبدأ بعد</small>';
return `<article class="lec ${r?r.s:''}" style="--kc:var(--k${c.color})"><div class="lh"><b>${esc(c.name)}</b><span class="tm">${t12(c.start)}–${t12(c.end)}</span></div><div class="lp"><small>${esc(c.place)}</small>${cf.has(c.id)?'<i class="cf">تعارض</i>':''}<button class="ed" data-edit="${c.id}" data-d="${iso(date)}" aria-label="تعديل المحاضرة">✎</button></div>${a}</article>`}
const dayList=d=>{const L=occ(d),cf=conf(L);return L.length?L.map(o=>lec(o,cf)).join(''):'<div class="empty">لا محاضرات</div>'};
function nextLec(){const now=new Date();for(let k=0;k<14;k++){const o=occ(addD(now,k)).find(o=>o.st>now);if(o)return o}return null}
const ecg='';
function grid(){const ws=addD(wsOf(new Date()),OFF*7),H0=8,H1=17,RH=58,now=new Date();
const heads=ORDER.map((dn,i)=>{const d=addD(ws,i);return `<div class="gh ${iso(d)===iso(now)?'td':''}"><span>${DAYN[dn]}</span><b>${d.getDate()}</b></div>`}).join('');
const hrs=Array.from({length:H1-H0},(_,i)=>`<div class="hr">${t12(pad(H0+i)+':00')}</div>`).join('');let cols='';
ORDER.forEach((dn,i)=>{const d=addD(ws,i),L=occ(d),cf=conf(L),lanes=[],pl=new Map(),nm=now.getHours()*60+now.getMinutes();
L.forEach(o=>{if(!cf.has(o.c.id))return;let k=lanes.findIndex(e=>e<=mn(o.c.start));if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=mn(o.c.end);pl.set(o.key,k)});
const n=Math.max(lanes.length,1);
cols+=`<div class="gc" style="height:${(H1-H0)*RH}px">`+(iso(d)===iso(now)&&nm>=H0*60&&nm<H1*60?`<div class="now" style="top:${(nm-H0*60)/60*RH}px"></div>`:'')+L.map(o=>{const c=o.c,r=ATT[o.key],k=pl.get(o.key),w=cf.has(c.id)?100/n:100,l=k!==undefined?k*w:0;
return `<button class="blk ${cf.has(c.id)?'cfx':''} ${r?r.s:''}" data-blk="${c.id}" data-d="${iso(o.date)}" style="--kc:var(--k${c.color});top:${(mn(c.start)-H0*60)/60*RH}px;height:${Math.max((mn(c.end)-mn(c.start))/60*RH-2,20)}px;inset-inline-start:calc(${l}% + 2px);width:calc(${w}% - 4px)">${esc(c.name)}<br><span>${t12(c.start)}–${t12(c.end)}</span></button>`}).join('')+'</div>'});
return `<div class="gw"><div class="gi"><div></div>${heads}<div>${hrs}</div>${cols}</div></div>`}
function openLec(id,d){const c=COURSES.find(x=>x.id===id);if(!c)return;const key=id+'|'+d,r=ATT[key],st=pd(d);st.setHours(0,mn(c.start));
$('#dlg').innerHTML=`<h3>${esc(c.name)}</h3><p style="margin:0 0 10px;color:var(--mute);font-size:14px">${fd(pd(d),{weekday:'long',day:'numeric',month:'long'})} · ${t12(c.start)}–${t12(c.end)} · ${esc(c.place)}</p>`+(r?`<div class="rec"><span>${LB[r.s]}</span><button data-undo="${key}" aria-label="تراجع">↶</button></div>`:1?`<div class="how">كيف حضرت؟</div><div class="bt">${['onsite','online','absent'].map(s=>`<button class="b-${s}" data-set="${s}" data-id="${id}" data-d="${d}">${LB[s]}</button>`).join('')}</div>`:'<small class="mu">لم تبدأ بعد</small>')+`<div class="two" style="margin-top:12px"><button class="pill" data-edit="${id}" data-d="${d}">تعديل</button><button class="pill" data-close>إغلاق</button></div>`;$('#dlg').showModal()}
function stats(){const R=recs(),pr=R.filter(r=>r.s!=='absent').length;let st=0;for(const r of R){if(r.s==='absent')break;st++}return{pct:R.length?Math.round(pr/R.length*100):null,st}}
function wkStat(ws){const now=new Date();let tot=0,reg=0;for(let i=0;i<7;i++)occ(addD(ws,i)).forEach(o=>{if(o.st<=now){tot++;if(ATT[o.key])reg++}});return{tot,reg}}
function warns(){const lm=S.lim||4,R=recs();return[...new Set(R.filter(r=>r.s==='absent').map(r=>r.name))].map(n=>{const ab=R.filter(r=>r.name===n&&r.s==='absent').length,left=lm-ab;return left<=0?`<div class="al bad">وصلت حد الغياب في «${esc(n)}» (${ab} من ${lm})</div>`:left===1?`<div class="al">باقي لك غياب واحد فقط في «${esc(n)}»</div>`:''}).join('')}
function wkbar(ws){return `<div class="wk"><button data-w="-1" aria-label="الأسبوع السابق">›</button><div style="text-align:center"><b>${fd(ws,{day:'numeric',month:'long'})} – ${fd(addD(ws,6),{day:'numeric',month:'long'})}</b>${OFF?'<br><button class="chip bk" data-w0>↺ العودة لهذا الأسبوع</button>':''}</div><button data-w="1" aria-label="الأسبوع التالي">‹</button></div>`}
function home(){const now=new Date(),n=nextLec(),ws=wsOf(now),{pct,st}=stats(),w=wkStat(ws),pn=occ(now).filter(o=>o.st<=now&&!ATT[o.key]).pop(),hr=now.getHours();
let nx='<div class="nxt"><div class="nm">لا توجد محاضرات قادمة</div></div>';
if(n){const df=Math.round((n.st-now)/6e4),dd=Math.floor(df/1440),h=Math.floor(df%1440/60),m=df%60;nx=`<div class="nxt"><div class="lb">المحاضرة القادمة</div><div class="nm">${esc(n.c.name)}</div><div class="mt">${fd(n.date,{weekday:'long'})} · ${t12(n.c.start)} · ${esc(n.c.place)}</div><div class="cdn">${dd?dd+'<small>يوم</small>':''}${h}<small>ساعة</small>${pad(m)}<small>دقيقة</small></div></div>`}
const pd=pn?`<div class="pend"><div class="lb">بانتظار تسجيلك</div><b>${esc(pn.c.name)}</b><div class="bt">${['onsite','online','absent'].map(s=>`<button class="b-${s}" data-set="${s}" data-id="${pn.c.id}" data-d="${iso(pn.date)}">${LB[s]}</button>`).join('')}</div></div>`:'';
return `<div><div class="gr">${hr<12?'صباح الخير':hr<18?'مساء الخير':'مساء النور'}</div><div class="dt">${fd(now,{weekday:'long',day:'numeric',month:'long'})}</div></div>${nx}
<div class="kpis"><div class="kp"><div class="kring" style="--p:${pct==null?0:pct}"><i>${pct==null?'—':pct+'%'}</i></div><small>نسبة الحضور</small></div><div class="kp"><b>${st}</b><small>سلسلة حضور</small></div><div class="kp"><b>${w.reg}<span style="font-size:18px;color:var(--mute)">/${w.tot}</span></b><small>مسجّل هذا الأسبوع</small></div></div>${warns()}${pd}
<h3>جدول الأسبوع</h3>${wkbar(addD(ws,OFF*7))}<div class="legend"><span><i style="background:var(--ok)"></i>حضوري</span><span><i style="background:var(--on)"></i>أونلاين</span><span><i style="background:var(--bad)"></i>غياب</span></div>${grid()}<p class="mu" style="margin:8px 0 0">اضغط على أي محاضرة لتسجيل حضورها أو تعديلها.</p><h3>محاضرات اليوم</h3>${dayList(now)}`}
function today(){const d=new Date();return `<h3>${fd(d,{weekday:'long',day:'numeric',month:'long'})}</h3>${dayList(d)}`}
function week(){const ws=addD(wsOf(new Date()),OFF*7),now=new Date();let tot=0,reg=0,h='';
ORDER.forEach((dn,i)=>{const d=addD(ws,i),L=occ(d),cf=conf(L);L.forEach(o=>{if(o.st<=now){tot++;if(ATT[o.key])reg++}});
h+=`<div class="dayh ${iso(d)===iso(now)?'td':''}"><b>${DAYN[dn]} ${fd(d,{day:'numeric',month:'long'})}</b><small>${fh(L.reduce((s,o)=>s+(mn(o.c.end)-mn(o.c.start))/60,0))} ساعة</small></div>`+(L.length?L.map(o=>lec(o,cf)).join(''):'<small class="mu" style="margin:0 2px 8px">لا محاضرات</small>')});
return `<section class="hero" style="border-radius:26px 6px 26px 6px">${ecg}<small>الأسبوع</small><h2>مسجّل ${reg} من ${tot}</h2><small>محاضرة بدأت</small></section>
${wkbar(ws)}${h}`}
const recs=()=>Object.entries(ATT).map(([k,r])=>({k,...r})).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function archive(){const all=recs(),names=[...new Set([...COURSES.map(c=>c.name),...all.map(r=>r.name)])],R=FILT==='all'?all:all.filter(r=>r.name===FILT);
const cnt=s=>R.filter(r=>r.s===s).length,on=cnt('onsite'),ol=cnt('online'),ab=cnt('absent'),pr=on+ol,pct=R.length?Math.round(pr/R.length*100):null;
const col=n=>(COURSES.find(c=>c.name===n)||all.find(r=>r.name===n)||{color:0}).color;
const cards=names.map(n=>{const a=all.filter(r=>r.name===n),p=a.filter(r=>r.s!=='absent').length,q=a.length?Math.round(p/a.length*100):0;return `<button class="pc ${FILT===n?'sel':''}" data-f="${esc(n)}" data-sc="1" style="--kc:var(--k${col(n)});--p:${q}"><div class="ring"><i>${a.length?q+'%':'—'}</i></div><b style="font-size:14px">${esc(n)}</b><small>حضرت ${p} · غياب ${a.length-p}</small><small>حضوري ${a.filter(r=>r.s==='onsite').length} · أونلاين ${a.filter(r=>r.s==='online').length}</small><div class="lim"><i style="width:${Math.min((a.length-p)/(S.lim||4)*100,100)}%;background:${(a.length-p)>=(S.lim||4)?'var(--bad)':(a.length-p)/(S.lim||4)>=.5?'var(--warn)':'var(--ok)'}"></i></div><small>متبقي ${Math.max((S.lim||4)-(a.length-p),0)} غياب</small></button>`}).join('');
const chips=['all',...names].map(n=>`<button class="chip ${FILT===n?'on':''}" data-f="${esc(n)}">${n==='all'?'الكل':esc(n)}</button>`).join('');
const RL=SF==='all'?R:R.filter(r=>r.s===SF),schips=['all','onsite','online','absent'].map(k=>`<button class="chip ${SF===k?'on':''}" data-sf="${k}">${k==='all'?'الكل':LB[k]} · ${k==='all'?R.length:R.filter(r=>r.s===k).length}</button>`).join(''),list=RL.length?RL.map(r=>`<div class="ar" style="--kc:var(--k${r.color||0})"><div class="h"><b>${esc(r.name)}</b><span class="tag" style="background:${KC[r.s]}">${LB[r.s]}</span></div><small style="color:var(--mute)">${fd(pd(r.date),{weekday:'long',day:'numeric',month:'long'})} · ${tr(r.time)}</small><input data-note="${esc(r.k)}" value="${esc(r.n||'')}" placeholder="ملاحظة (اختياري)"></div>`).join(''):'<div class="empty">ما في سجلات هنا بعد.</div>';
return `<section class="hero"><small>أرشيف الحضور</small><h2>${FILT==='all'?'كل المواد':esc(FILT)}</h2>${ecg}</section>
<div class="stats"><div class="st"><span>حضرت</span><b style="color:var(--ok)">${pr}</b></div><div class="st"><span>غياب</span><b style="color:var(--bad)">${ab}</b></div><div class="st"><span>النسبة</span><b>${pct==null?'—':pct+'%'}</b></div><div class="st"><span>حضوري</span><b>${on}</b></div><div class="st"><span>أونلاين</span><b>${ol}</b></div><div class="st"><span>المسجّل</span><b>${R.length}</b></div></div>
<h3>حصر كل مادة</h3><div class="big">${cards}</div><h3>السجل</h3><div class="chips" id="flt">${chips}</div><div class="chips sf">${schips}</div>${list}<button class="pill go" data-copy>نسخ الأرشيف كنص</button>`}
function settings(){return `<h3>الإعدادات</h3><div class="row"><span>المظهر</span><span><button class="pill" data-th="light">فاتح</button> <button class="pill" data-th="dark">داكن</button> <button class="pill" data-th="auto">تلقائي</button></span></div>
<div class="row"><span>التذكير قبل المحاضرة</span><select id="rm" class="pill">${[5,10,15,30].map(n=>`<option value="${n}" ${S.rem===n?'selected':''}>${n} د</option>`).join('')}</select></div>
<div class="row"><span>التذكيرات تعمل والصفحة مفتوحة</span><button class="pill ${S.remOn?'go':''}" data-bell>${S.remOn?'مفعّلة':'تفعيل'}</button></div>
<div class="row"><span>نغمة الدخولية</span><button class="pill ${S.snd===false?'':'go'}" data-snd>${S.snd===false?'مكتومة':'شغّالة'}</button></div><div class="row"><span>حد الغياب لكل مادة</span><select id="lim" class="pill">${[2,3,4,5,6,8].map(n=>`<option value="${n}" ${(S.lim||4)===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="row"><span>مسح سجل الحضور</span><button class="pill" data-clr>مسح</button></div>${trashHTML()}`}
function trashHTML(){return `<h3>سلة المحذوفات</h3>`+(TRASH.length?TRASH.map(c=>`<div class="row"><span><b>${esc(c.name)}</b><br><small style="color:var(--mute)">${DAYN[c.day]} ${t12(c.start)}–${t12(c.end)}${c.date?' · '+c.date:''} · حُذفت ${fd(new Date(c.deletedAt),{day:'numeric',month:'long'})}</small></span><span><button class="pill" data-rest="${c.id}">استرجاع</button> <button class="pill" data-perm="${c.id}" style="color:var(--bad)">حذف نهائي</button></span></div>`).join('')+`<button class="pill" data-empty style="color:var(--bad)">إفراغ السلة</button>`:'<div class="empty">السلة فاضية</div>')}
function ask(msg,ok,fn){PEND=fn;$('#cfm').innerHTML=`<h3>تأكيد</h3><p style="margin:0 0 14px">${msg}</p><div class="two"><button class="pill go" data-yes>${ok}</button><button class="pill" data-no>تراجع</button></div>`;$('#cfm').showModal()}
const TABS=[['home','⌂','الرئيسية'],['today','◷','اليوم'],['week','▦','الأسبوع'],['archive','☰','الأرشيف'],['settings','⚙','الإعدادات']],VIEW={home,today,week,archive,settings};
function render(keep){const y=scrollY;$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${k===TAB?'on':''}" data-t="${k}"><span>${i}</span>${l}</button>`).join('');
$('#app').className=keep?'':'in';$('#app').innerHTML=`<div class="top"><button class="chip" data-intro aria-label="الرجوع للدخولية">↩ الدخولية</button><h1>جدولي الدراسي</h1><button class="chip ${S.remOn?'on':''}" data-bell>🔔 ${S.rem} د</button></div>`+VIEW[TAB]();if(keep)scrollTo(0,y)}
function theme(){S.theme==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=S.theme}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),4000)}
async function bell(){if(S.remOn){S.remOn=false}else{S.remOn=true;try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}toast('التذكير شغّال طول ما الصفحة مفتوحة')}saveAll();render(1)}
const fired=new Set();setInterval(()=>{if(!S.remOn)return;const now=new Date();occ(now).forEach(o=>{const df=(o.st-now)/6e4;if(df>0&&df<=S.rem&&!fired.has(o.key)){fired.add(o.key);const m=`${o.c.name} تبدأ ${t12(o.c.start)} · ${o.c.place}`;toast(m);try{if(Notification.permission==='granted')new Notification('محاضرة قريبة',{body:m})}catch(e){}}})},30000);
function form(id,dt){if($('#dlg').open)$('#dlg').close();EDIT=id;EDITD=dt;const c=id&&COURSES.find(x=>x.id===id),names=[...new Set(COURSES.map(c=>c.name))],d0=c?(c.date||dt):iso(new Date());
$('#dlg').innerHTML=`<h3>${c?'تعديل المحاضرة':'إضافة محاضرة'}</h3><label>المادة<input id="f-n" list="nl" value="${c?esc(c.name):''}" placeholder="اكتب أو اختر مادة"></label><datalist id="nl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
<label>التاريخ (اليوم)<input type="date" id="f-d" value="${d0}"></label><div class="two"><label>البداية<input type="time" id="f-s" value="${c?c.start:'09:00'}"></label><label>النهاية<input type="time" id="f-e" value="${c?c.end:'10:00'}"></label></div>
<label>المكان<input id="f-p" value="${c?esc(c.place):'Online'}"></label>${c&&c.date?'':c?'<label>تطبيق التعديل على<select id="f-r"><option value="once">هذا اليوم فقط</option><option value="weekly">كل الأسابيع (أسبوعيًا)</option></select></label>':'<label>نوع الإضافة<select id="f-r"><option value="once">يوم معين فقط (مرة واحدة)</option><option value="weekly" selected>أسبوعيًا (كل أسبوع في نفس اليوم)</option></select></label>'}<p id="err"></p>
<div class="two"><button class="pill go" data-save>${c?'حفظ':'إضافة'}</button><button class="pill" data-close>إلغاء</button></div>${c?'<button class="pill" data-del style="width:100%;margin-top:8px;color:var(--bad)">حذف المحاضرة</button>':''}`;$('#dlg').showModal()}
function saveForm(){const name=$('#f-n').value.trim(),s=$('#f-s').value,e=$('#f-e').value,ds=$('#f-d').value,er=$('#err');
if(!name||!ds||!s||!e){er.textContent='عبّ كل الحقول';return}if(mn(e)<=mn(s)){er.textContent='وقت النهاية لازم يكون بعد البداية';return}
const go=()=>{const dt=pd(ds),old=COURSES.find(c=>c.name===name&&c.id!==EDIT),col=old?old.color:new Set(COURSES.map(c=>c.name)).size%7;let c=EDIT&&COURSES.find(x=>x.id===EDIT);const sel=$('#f-r'),mode=sel?sel.value:'self';if(c&&!c.date&&mode==='once'){const od=EDITD;c.skip=c.skip||[];if(od&&!c.skip.includes(od))c.skip.push(od);const n={id:'x'+Date.now(),color:c.color,name,start:s,end:e,day:dt.getDay(),place:$('#f-p').value||'Online',date:ds};COURSES.push(n);const ok=c.id+'|'+od,r=ATT[ok];if(r){delete ATT[ok];ATT[n.id+'|'+ds]={...r,name,time:s+'–'+e,date:ds}}saveAll();$('#dlg').close();render(1);return}
if(!c){c={id:'x'+Date.now(),color:col};COURSES.push(c)}Object.assign(c,{name,start:s,end:e,day:dt.getDay(),place:$('#f-p').value||'Online'});
if(mode==='weekly')delete c.date;else c.date=ds;saveAll();$('#dlg').close();render(1)};ask((EDIT?'تأكيد حفظ التعديلات على «':'تأكيد إضافة «')+esc(name)+'»؟','تأكيد',go)}
function copyText(){const R=(FILT==='all'?recs():recs().filter(r=>r.name===FILT)),t='أرشيف الحضور\n'+R.map(r=>`${fd(pd(r.date),{weekday:'long',day:'numeric',month:'long'})} | ${r.name} (${tr(r.time)}): ${LB[r.s]}${r.n?' - '+r.n:''}`).join('\n');
const ok=()=>toast('تم نسخ الأرشيف');try{navigator.clipboard.writeText(t).then(ok,()=>fb())}catch(e){fb()}
function fb(){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('تعذّر النسخ')}a.remove()}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
if(D.t){TAB=D.t;render();scrollTo(0,0)}else if(D.set){const c=COURSES.find(x=>x.id===D.id);ask('تسجّل «'+esc(c.name)+'» كـ '+LB[D.set]+'؟','تأكيد',()=>{ATT[D.id+'|'+D.d]={s:D.set,t:Date.now(),name:c.name,time:c.start+'–'+c.end,color:c.color,date:D.d,n:''};saveAll();if($('#dlg').open)$('#dlg').close();render(1)})}
else if(D.undo){ask('تلغي تسجيل الحضور؟','إلغاء التسجيل',()=>{delete ATT[D.undo];saveAll();if($('#dlg').open)$('#dlg').close();render(1)})}else if(D.blk)openLec(D.blk,D.d);else if(D.edit)form(D.edit,D.d);else if(D.w!==undefined){OFF+=+D.w;render(1)}else if(D.f!==undefined){FILT=(D.sc&&FILT===D.f)?'all':D.f;render(1);if(D.sc)setTimeout(()=>{const f=$('#flt');f&&f.scrollIntoView({behavior:'smooth',block:'start'})},60)}else if(D.sf!==undefined){SF=D.sf;render(1)}
else if(D.intro!==undefined){showIntro()}else if(D.start!==undefined||D.skip!==undefined){startApp()}else if(D.w0!==undefined){OFF=0;render(1)}else if(D.snd!==undefined){S.snd=S.snd===false;saveAll();sndUI();if(S.snd===false){AC&&AC.suspend&&AC.suspend()}else{MP=0;if(AC&&AC.resume)AC.resume();melody()}if(TAB==='settings')render(1)}else if(D.th){S.theme=D.th;theme();saveAll()}else if(D.clr!==undefined)ask('تمسح كل سجل الحضور؟','مسح',()=>{ATT={};saveAll();render(1)});else if(D.bell!==undefined)bell();else if(D.copy!==undefined)copyText();
else if(D.save!==undefined)saveForm();else if(D.close!==undefined)$('#dlg').close();else if(D.del!==undefined){const c=COURSES.find(x=>x.id===EDIT);if(c)ask('تحذف «'+esc(c.name)+'»؟ تنتقل لسلة المحذوفات في الإعدادات وتقدر ترجعها.','حذف',()=>{TRASH.push({...c,deletedAt:Date.now()});COURSES=COURSES.filter(x=>x.id!==c.id);saveAll();$('#dlg').close();render(1)})}else if(D.yes!==undefined){$('#cfm').close();const f=PEND;PEND=null;f&&f()}else if(D.no!==undefined){$('#cfm').close();PEND=null}else if(D.rest){const c=TRASH.find(x=>x.id===D.rest);if(c){TRASH=TRASH.filter(x=>x!==c);delete c.deletedAt;COURSES.push(c);saveAll();render(1);toast('تم استرجاع المحاضرة')}}else if(D.perm){const c=TRASH.find(x=>x.id===D.perm);if(c)ask('حذف «'+esc(c.name)+'» نهائيًا؟ ما تقدر ترجعها بعدها.','حذف نهائي',()=>{TRASH=TRASH.filter(x=>x!==c);saveAll();render(1)})}else if(D.empty!==undefined)ask('تفرّغ السلة نهائيًا؟ ما تقدر ترجع شي منها.','إفراغ السلة',()=>{TRASH=[];saveAll();render(1)})});
document.addEventListener('change',e=>{if(e.target.dataset.note!==undefined){const r=ATT[e.target.dataset.note];if(r){r.n=e.target.value;saveAll()}}else if(e.target.id==='lim'){S.lim=+e.target.value;saveAll();render(1)}else if(e.target.id==='rm'){S.rem=+e.target.value;saveAll();render(1)}});
$('#fab').onclick=()=>form();theme();render();
let AC=null,MP=0,RT=0,MG=null;
function ctx(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC}catch(e){return null}}
function verb(c){const n=c.sampleRate*2.4|0,b=c.createBuffer(2,n,c.sampleRate);for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}const v=c.createConvolver();v.buffer=b;return v}
function rig(c){const m=c.createGain(),cp=c.createDynamicsCompressor(),v=verb(c),w=c.createGain(),d=c.createGain();m.gain.value=.9;w.gain.value=.55;d.gain.value=.8;m.connect(d);m.connect(v);v.connect(w);d.connect(cp);w.connect(cp);cp.connect(c.destination);MG=m;return m}
function pluck(c,f,t,o,v){const a=c.createOscillator(),b=c.createOscillator(),g=c.createGain(),h=c.createGain(),lp=c.createBiquadFilter();a.type='triangle';a.frequency.value=f;b.type='sine';b.frequency.value=f*2.003;lp.type='lowpass';lp.frequency.value=5200;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);h.gain.setValueAtTime(0,t);h.gain.linearRampToValueAtTime(v*.3,t+.004);h.gain.exponentialRampToValueAtTime(.0001,t+.45);a.connect(g);b.connect(h);g.connect(lp);h.connect(lp);lp.connect(o);a.start(t);b.start(t);a.stop(t+1.6);b.stop(t+.6)}
function padS(c,f,t,d,o){[-7,7].forEach(dt=>{const a=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();a.type='sawtooth';a.frequency.value=f;a.detune.value=dt;lp.type='lowpass';lp.frequency.value=950;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+.55);g.gain.setValueAtTime(.03,t+d);g.gain.linearRampToValueAtTime(0,t+d+1.2);a.connect(lp);lp.connect(g);g.connect(o);a.start(t);a.stop(t+d+1.3)})}
const CH=[[0,[220,261.63,329.63,493.88],[440,523.25,659.25,987.77],1.35],[1.35,[174.61,220,261.63,329.63],[349.23,440,523.25,659.25],1.35],[2.7,[196,246.94,293.66,440],[392,493.88,587.33,783.99],1.2],[3.9,[130.81,261.63,329.63,587.33],[523.25,659.25,783.99,1046.5,1318.5],2.4]];
function melody(auto){if(S.snd===false||MP)return;const c=ctx();if(!c)return;const go=()=>{if(MP)return;MP=1;$('#intro').classList.remove('need');const t=c.currentTime+.08,m=rig(c);CH.forEach(([o,pd,ar,d])=>{pd.forEach(f=>padS(c,f,t+o,d,m));ar.forEach((f,i)=>pluck(c,f,t+o+i*(o>3?.2:.3),m,.17))})};
if(c.state==='running')go();else if(auto)$('#intro').classList.add('need');else c.resume().then(go).catch(()=>{})}
function stopTune(){if(MG&&AC){const t=AC.currentTime;try{MG.gain.cancelScheduledValues(t);MG.gain.setValueAtTime(MG.gain.value,t);MG.gain.linearRampToValueAtTime(0,t+.5)}catch(e){}}MG=null}
const sndUI=()=>{const b=$('#sndb');if(b)b.classList.toggle('off',S.snd===false)};
function showIntro(){const el=$('#intro');clearTimeout(RT);stopTune();el.classList.remove('out','play','rdy','need');void el.offsetWidth;el.classList.add('play');MP=0;RT=setTimeout(()=>el.classList.add('rdy'),5000);melody()}
function startApp(){const el=$('#intro');stopTune();el.classList.add('out');setTimeout(()=>{if(el.classList.contains('out')){el.classList.remove('play','rdy','need');if(AC&&AC.suspend)AC.suspend().catch(()=>{})}},900);scrollTo(0,0)}
(function(){const el=$('#intro'),pt=el.querySelector('.ig');for(let i=0;i<16;i++){const d=document.createElement('i');d.className='pt';d.style.cssText=`left:${Math.random()*100}%;animation-duration:${6+Math.random()*7}s;animation-delay:${-Math.random()*8}s;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px`;pt.append(d)}sndUI();el.addEventListener('pointerdown',e=>{if(!MP&&!e.target.closest('.go2,.sb,.sk'))showIntro()});RT=setTimeout(()=>el.classList.add('rdy'),5000);melody(1)})();setInterval(()=>{if(TAB==='home'&&!document.querySelector('dialog[open]'))render(1)},60000);
</script>

</body></html>
